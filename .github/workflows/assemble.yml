name: Assemble EventSlides project
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and unpack project
        shell: bash
        run: |
          cat .upload/part-* > /tmp/EventSlides-project.tar.gz
          echo "400c397f5d651accbc1e6d668dd884fe82f0ea0eca0176ea0dd524c2df2c88b2  /tmp/EventSlides-project.tar.gz" | sha256sum -c -
          mkdir -p /tmp/eventslides-final
          tar -xzf /tmp/EventSlides-project.tar.gz -C /tmp/eventslides-final
      - name: Commit assembled files
        shell: bash
        run: |
          rm -rf .upload
          rm -f .github/workflows/assemble.yml
          cp -a /tmp/eventslides-final/. .
          git add -A
          git config user.name "erubyte"
          git config user.email "nora.vzb@gmail.com"
          git commit -m "Publish EventSlides project"
          git push origin main
